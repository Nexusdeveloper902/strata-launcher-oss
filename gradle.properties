org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Gradle Managed Devices refuse API <= 26 unless opted in; minSdk is 26 so the API 26 smoke device is required.
android.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true
# Maven Central answers bursts of CI downloads with HTTP 429. Gradle retries 429/5xx (never a 404), by default 3 attempts
# about 1-2 s apart, too short for a throttle (PR #27 unit job, run 45463909182, both attempts). 8 attempts with a
# doubling backoff from 1 s wait up to ~2 min in total per file. docs/ci/RELIABILITY.md "What was flaky, and why".
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=1000

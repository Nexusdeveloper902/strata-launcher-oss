name: Nightly

# M9 nightly matrix (ARCHITECTURE 14.3, TEST_PLAN T-COMPAT-01/02, T-REL-01, T-PERF-12). Not a merge gate: it runs on
# main every night and on demand (Actions -> Nightly -> Run workflow), and its results feed the v1 release gate
# (docs/release/RELEASE_GATE.md). Scheduled runs only happen on the default branch of the public mirror.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event name keeps a manual run and the scheduled run in separate groups, so neither cancels the other.
  group: nightly-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
  # The P0 journey suite of T-COMPAT-01 (T-HOME-01, T-SEARCH-01, T-APPS-02, T-FAV-02, onboarding) plus the M9
  # reliability and compatibility classes.
  P0_CLASSES: >-
    app.strata.launcher.HomeSmokeTest,app.strata.launcher.home.HomeDeviceTest,app.strata.launcher.catalog.ListDeviceTest,app.strata.launcher.search.SearchDeviceTest,app.strata.launcher.onboarding.OnboardingDeviceTest,app.strata.launcher.home.DefaultHomeDeviceTest,app.strata.launcher.rel.OptionalAccessDeniedDeviceTest,app.strata.launcher.rel.NoNetworkDeviceTest,app.strata.launcher.compat.InsetsDeviceTest,app.strata.launcher.compat.WindowSizesDeviceTest

jobs:
  compat-matrix:
    name: T-COMPAT-01 API ${{ matrix.api }} try ${{ matrix.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [29, 33]
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/local/.ghcup /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk \
            /usr/local/graalvm /usr/local/share/chromium /usr/lib/google-cloud-sdk /usr/lib/jvm/temurin-8-jdk-amd64
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: P0 journeys on the managed device
        run: >-
          tools/ci/run-gmd.sh api${{ matrix.api }}DebugAndroidTest
          "-Pandroid.testInstrumentationRunnerArguments.class=${{ env.P0_CLASSES }}"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-compat-api${{ matrix.api }}-try${{ matrix.attempt }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

  nav-modes:
    name: T-COMPAT-02 API ${{ matrix.api }} ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [29]
        mode: [gestural, threebutton]
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/local/.ghcup /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk \
            /usr/local/graalvm /usr/local/share/chromium /usr/lib/google-cloud-sdk /usr/lib/jvm/temurin-8-jdk-amd64
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Gesture and Back tests in ${{ matrix.mode }} navigation
        run: >-
          tools/ci/run-gmd.sh api${{ matrix.api }}DebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=app.strata.launcher.home.HomeDeviceTest,app.strata.launcher.search.SearchDeviceTest
          -Pandroid.testInstrumentationRunnerArguments.strata.navMode=${{ matrix.mode }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-nav-api${{ matrix.api }}-${{ matrix.mode }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

  monkey:
    # T-REL-01 on API 34 (the TEST_PLAN environment) against the release-like benchmark build: 70 000 events, ~1 h.
    # ATD image (api34atd): see AndroidBenchmarkConventionPlugin and docs/ci/RELIABILITY.md.
    name: T-REL-01 monkey (GMD API 34 ATD, 70 000 events)
    if: false # SCRATCH round 4: monkey already 2/2 on ATD
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/local/.ghcup /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk \
            /usr/local/graalvm /usr/local/share/chromium /usr/lib/google-cloud-sdk /usr/lib/jvm/temurin-8-jdk-amd64
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Monkey
        run: >-
          tools/ci/run-gmd.sh :benchmark:api34atdBenchmarkAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=app.strata.launcher.benchmark.MonkeyTest
          -Pandroid.testInstrumentationRunnerArguments.strata.monkeyEvents=70000
          -Pandroid.testInstrumentationRunnerArguments.strata.monkeyThrottle=50
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-monkey
          path: |
            benchmark/build/reports/androidTests/
            benchmark/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

  baseline-profile:
    # Collects the app's Baseline Profile on an emulator (profiles record which code runs, not how fast, so an emulator
    # profile is valid). The owner reviews the artifact and commits it as app/src/main/baseline-prof.txt.
    name: Baseline Profile (GMD API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/local/.ghcup /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk \
            /usr/local/graalvm /usr/local/share/chromium /usr/lib/google-cloud-sdk /usr/lib/jvm/temurin-8-jdk-amd64
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate
        run: >-
          tools/ci/run-gmd.sh :benchmark:api34BenchmarkAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=app.strata.launcher.benchmark.BaselineProfileGenerator
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,LOW-BATTERY
      - name: Upload the profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile
          path: |
            benchmark/build/outputs/**/*-baseline-prof.txt
            benchmark/build/outputs/**/*-startup-prof.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Upload reports
        # The Gradle log only says "There were failing tests"; the report and the per-test logcat say which and why.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-baseline-profile-reports
          path: |
            benchmark/build/reports/androidTests/
            benchmark/build/outputs/androidTest-results/
            benchmark/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: ignore
          retention-days: 14

  smoke-repeat:
    name: FLAKE smoke API ${{ matrix.api }} try ${{ matrix.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34, 36]
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free disk space (the hosted runner has ~14 GB free; AGP needs the system image, its snapshot and a 6 GB userdata image)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/local/.ghcup /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk \
            /usr/local/graalvm /usr/local/share/chromium /usr/lib/google-cloud-sdk /usr/lib/jvm/temurin-8-jdk-amd64
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: KVM preflight (the emulator needs /dev/kvm; fail here, not 5 minutes into Gradle)
        run: |
          ls -l /dev/kvm
          test -w /dev/kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          # Default installs the removed legacy 'tools' package and fails.
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache emulator system images
        uses: actions/cache@v6
        with:
          path: ~/.android/avd/gradle-managed
          key: gmd-${{ runner.os }}-${{ matrix.api }}-${{ hashFiles('build-logic/convention/src/main/kotlin/AndroidConfig.kt') }}
      - name: Smoke test on the managed device (retries only infrastructure failures)
        run: tools/ci/run-gmd.sh api${{ matrix.api }}DebugAndroidTest
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-smoke-api${{ matrix.api }}-try${{ matrix.attempt }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

  benchmark-repeat:
    # M9: the Macrobenchmarks as correctness checks on an emulator (dry run: one iteration, no budgets; the budgets are
    # asserted only on a physical device, docs/release/RELEASE_GATE.md). Also T-PERF-09's jobs/alarms check.
    name: FLAKE Macrobenchmark try ${{ matrix.attempt }}
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/local/.ghcup /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk \
            /usr/local/graalvm /usr/local/share/chromium /usr/lib/google-cloud-sdk /usr/lib/jvm/temurin-8-jdk-amd64
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: KVM preflight
        run: |
          ls -l /dev/kvm
          test -w /dev/kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          # Default installs the removed legacy 'tools' package and fails.
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache emulator system images
        uses: actions/cache@v6
        with:
          path: ~/.android/avd/gradle-managed
          key: gmd-${{ runner.os }}-34-${{ hashFiles('build-logic/convention/src/main/kotlin/AndroidConfig.kt') }}
      - name: Macrobenchmarks, dry run (retries only infrastructure failures)
        run: >-
          tools/ci/run-gmd.sh :benchmark:api34BenchmarkAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.dryRunMode.enable=true
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,LOW-BATTERY
          -Pandroid.testInstrumentationRunnerArguments.notClass=app.strata.launcher.benchmark.BaselineProfileGenerator
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-benchmark-try${{ matrix.attempt }}
          path: |
            benchmark/build/reports/androidTests/
            benchmark/build/outputs/androidTest-results/
            benchmark/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: ignore
          retention-days: 7

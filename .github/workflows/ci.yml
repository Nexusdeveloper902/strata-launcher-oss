name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-check a commit on demand (e.g. main after a merge, docs/ci/RELIABILITY.md); runs the same jobs as a push.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    name: Build (debug APK, androidTest APK, benchmark)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          # Default installs the removed legacy 'tools' package and fails.
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble
        run: ./gradlew assembleDebug assembleDebugAndroidTest :app:assembleBenchmark :benchmark:assemble --stacktrace
      # T-CI-07 (R8, size per ABI, not debuggable, no test code) on the release APK, which is also uploaded for the
      # owner's phone. Signed with the stable release key only on a push to main or a manual run ON MAIN, and only when
      # all four secrets exist; pull_request runs and other branches never see the secrets (the expressions below yield
      # '' for them). Without
      # the key it is a debug-signed TEST build, uploaded under a name that says so: a different key cannot update an
      # installed release. CONTRIBUTING.md "Release APK from CI", docs/release/RELEASE_GATE.md §3.11.
      - name: Release APK (T-CI-07)
        id: release
        env:
          KEYSTORE_BASE64: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && secrets.STRATA_RELEASE_KEYSTORE_BASE64 || '' }}
          STORE_PASSWORD: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && secrets.STRATA_RELEASE_STORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && secrets.STRATA_RELEASE_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && secrets.STRATA_RELEASE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            # Outside the workspace, deleted when the step ends however it ends. Never printed.
            keystore="$RUNNER_TEMP/strata-release.jks"
            trap 'rm -f "$keystore"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"
            # No configuration cache: it would store the signing values read from the environment.
            STRATA_RELEASE_STORE_FILE="$keystore" STRATA_RELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
              STRATA_RELEASE_KEY_ALIAS="$KEY_ALIAS" STRATA_RELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
              ./gradlew :app:checkReleaseApk --no-configuration-cache --stacktrace
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            set_count=0
            for v in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do [ -z "$v" ] || set_count=$((set_count + 1)); done
            if [ "$set_count" -gt 0 ]; then
              echo "::warning::only $set_count of the 4 STRATA_RELEASE_* secrets are set; building the unsigned TEST APK"
            fi
            ./gradlew :app:checkReleaseApk -Pstrata.release.debugSigned=true --stacktrace
            echo "kind=test" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the release APK signature
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          certs="$("$ANDROID_HOME"/build-tools/36.1.0/apksigner verify --print-certs "$apk")"
          sha256="$(printf '%s\n' "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          [ -n "$sha256" ] || { echo "::error::no signer certificate in $apk"; exit 1; }
          if [ "${{ steps.release.outputs.kind }}" = release ] && printf '%s\n' "$certs" | grep -q '^Signer #1 certificate DN: .*CN=Android Debug'; then
            echo "::error::the release APK is signed with a debug certificate; check the STRATA_RELEASE_* secrets"
            exit 1
          fi
          mkdir -p dist
          if [ "${{ steps.release.outputs.kind }}" = release ]; then
            name=strata-release-apk; file="dist/strata-release-${GITHUB_SHA::7}.apk"
            note="Signed with the release key. Installs over an earlier release APK when this SHA-256 matches."
          else
            name=strata-release-apk-unsigned-test; file="dist/strata-release-TEST-not-for-install-${GITHUB_SHA::7}.apk"
            note="NOT signed with the release key (debug key of this runner): a test build that cannot update an installed release."
          fi
          cp "$apk" "$file"
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
          {
            echo "### Release APK"
            echo "- Artifact: \`$name\` ($(basename "$file"))"
            echo "- Signer certificate SHA-256: \`$sha256\`"
            echo "- $note"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload release APK report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-report
          path: app/build/reports/release-apk.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload debug APK (sideload)
        uses: actions/upload-artifact@v7
        with:
          name: strata-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  unit:
    name: Unit and Robolectric tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          # Default installs the removed legacy 'tools' package and fails.
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests (JVM, Robolectric, lint rules) and build-logic gate tests
        run: ./gradlew testDebugUnitTest :build-logic:convention:test --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  lint:
    name: Android Lint (T-CI-04)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          # Default installs the removed legacy 'tools' package and fails.
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew lintDebug --stacktrace
      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-debug.*"
          retention-days: 7

  ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          # Default installs the removed legacy 'tools' package and fails.
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ktlintCheck --stacktrace

  static-gates:
    name: Static gates (permissions, dependencies, module graph, entitlements)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          # Default installs the removed legacy 'tools' package and fails.
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: T-CI-01 checkPermissions, T-CI-02 checkDependencies, T-CI-03 checkModuleGraph, T-CI-08 checkEntitlements, T-CI-05 checkLicences
        run: ./gradlew checkPermissions checkDependencies checkModuleGraph checkEntitlements checkLicences --stacktrace
      - name: Mirror sync safety net (tools/mirror/test-sync.sh, dry runs on a scratch repository)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q git-filter-repo
          sh tools/mirror/test-sync.sh

  gmd-smoke:
    name: GMD smoke (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            task: api26DebugAndroidTest
          - api: 34
            task: api34DebugAndroidTest
          - api: 36
            task: api36DebugAndroidTest
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free disk space (the hosted runner has ~14 GB free; AGP needs the system image, its snapshot and a 6 GB userdata image)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/local/.ghcup /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk \
            /usr/local/graalvm /usr/local/share/chromium /usr/lib/google-cloud-sdk /usr/lib/jvm/temurin-8-jdk-amd64
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: KVM preflight (the emulator needs /dev/kvm; fail here, not 5 minutes into Gradle)
        run: |
          ls -l /dev/kvm
          test -w /dev/kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          # Default installs the removed legacy 'tools' package and fails.
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache emulator system images
        uses: actions/cache@v6
        with:
          path: ~/.android/avd/gradle-managed
          key: gmd-${{ runner.os }}-${{ matrix.api }}-${{ hashFiles('build-logic/convention/src/main/kotlin/AndroidConfig.kt') }}
      - name: Smoke test on the managed device (retries only infrastructure failures)
        run: tools/ci/run-gmd.sh ${{ matrix.task }}
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gmd-reports-api${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

  benchmark-gmd:
    # M9: the Macrobenchmarks as correctness checks on an emulator (dry run: one iteration, no budgets; the budgets are
    # asserted only on a physical device, docs/release/RELEASE_GATE.md). Also T-PERF-09's jobs/alarms check.
    name: Macrobenchmark correctness (GMD API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/local/.ghcup /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk \
            /usr/local/graalvm /usr/local/share/chromium /usr/lib/google-cloud-sdk /usr/lib/jvm/temurin-8-jdk-amd64
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: KVM preflight
        run: |
          ls -l /dev/kvm
          test -w /dev/kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          # Default installs the removed legacy 'tools' package and fails.
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache emulator system images
        uses: actions/cache@v6
        with:
          path: ~/.android/avd/gradle-managed
          key: gmd-${{ runner.os }}-34-${{ hashFiles('build-logic/convention/src/main/kotlin/AndroidConfig.kt') }}
      - name: Macrobenchmarks, dry run (retries only infrastructure failures)
        run: >-
          tools/ci/run-gmd.sh :benchmark:api34BenchmarkAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.dryRunMode.enable=true
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,LOW-BATTERY
          -Pandroid.testInstrumentationRunnerArguments.notClass=app.strata.launcher.benchmark.BaselineProfileGenerator
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-gmd-reports
          path: |
            benchmark/build/reports/androidTests/
            benchmark/build/outputs/androidTest-results/
            benchmark/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: ignore
          retention-days: 7

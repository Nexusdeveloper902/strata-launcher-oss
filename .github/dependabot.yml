# Dependabot version updates.
# New or bumped libraries must still pass `./gradlew checkDependencies` (the allow-list,
# T-CI-02); a Dependabot PR that adds a disallowed artifact fails CI and must not be merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
